name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Llama Swatch ${{ github.ref_name }}"
          releaseBody: "Unsigned build. See the README for first-launch steps on each OS."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  checksums:
    # Runs only after every platform job has uploaded its assets to the draft
    # release, so the checksum file covers the complete release. The release is
    # published here, so a failed platform build leaves it as an unpublished draft.
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --pattern '*'
          rm -f assets/SHA256SUMS.txt
      - name: Compute SHA256SUMS.txt
        working-directory: assets
        env:
          LC_ALL: C
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt
        run: gh release upload "$TAG" SHA256SUMS.txt --clobber
      - name: Publish release
        run: gh release edit "$TAG" --draft=false
